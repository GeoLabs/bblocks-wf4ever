  wasOutputFrom:
    x-jsonld-id: http://purl.org/wf4ever/roterms#wasOutputFrom
    x-jsonld-type: '@id'
  authoredBy:
    x-jsonld-id: http://purl.org/wf4ever/roterms#authoredBy
